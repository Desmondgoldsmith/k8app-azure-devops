apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8app-backend
  namespace: backend

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: k8app-backend

  template:
    metadata:
      labels:
        app: k8app-backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 80

          env:
            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: k8app-backend-config
                  key: PROJECT_NAME

            - name: POSTGRES_SERVER
              valueFrom:
                configMapKeyRef:
                  name: k8app-backend-config
                  key: POSTGRES_SERVER

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: k8app-backend-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: k8app-backend-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8app-backend-secret
                  key: POSTGRES_PASSWORD
