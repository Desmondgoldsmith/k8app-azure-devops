apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8app-frontend
  namespace: frontend

spec:
  replicas: {{ .Values.frontend.replicas }}

  selector:
    matchLabels:
      app: k8app-frontend

  template:
    metadata:
      labels:
        app: k8app-frontend

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
